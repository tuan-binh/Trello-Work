name: CI/CD Pipeline

on:
  push:
    branches:
      - main # Kích hoạt pipeline khi có code đẩy lên nhánh main
  workflow_dispatch: # Cho phép bấm Run workflow thủ công từ GitHub Actions tab để test

jobs:
  # 1. Build & Push Backend song song (có cache GitHub Actions giúp build cực nhanh)
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'binh1892001' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ hashFiles('back_end/Dockerfile') != '' && './back_end' || './trello-work-backend' }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME || 'binh1892001' }}/trello-work-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 2. Build & Push Frontend song song
  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'binh1892001' }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ hashFiles('front_end/Dockerfile') != '' && './front_end' || './trello-work-frontend' }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME || 'binh1892001' }}/trello-work-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL || '' }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Tự động cập nhật file docker-compose.yml và kích hoạt deploy trên VPS
  deploy-to-vps:
    name: Deploy to VPS
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare docker-compose.yml
        run: |
          if [ -f docker-compose.yml ]; then
            echo "COMPOSE_B64=$(base64 -w 0 docker-compose.yml)" >> $GITHUB_ENV
          else
            echo "COMPOSE_B64=" >> $GITHUB_ENV
            echo "WARNING: docker-compose.yml not found in root, will skip overwriting on VPS"
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME || 'binh1892001' }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          envs: COMPOSE_B64,DOCKER_USER,DOCKER_PASS
          script: |
            set -e
            mkdir -p /root/trello_work_project
            cd /root/trello_work_project

            # Cập nhật file docker-compose.yml từ repo nếu có
            if [ -n "$COMPOSE_B64" ]; then
              echo "$COMPOSE_B64" | base64 -d > docker-compose.yml
              echo "==> Đã cập nhật docker-compose.yml"
            fi

            # 0. Tự động đồng bộ thời gian chuẩn (NTP) cho VPS để tránh lỗi lệch giờ Google OAuth2
            echo "==> Tự động đồng bộ đồng hồ hệ thống VPS..."
            timedatectl set-timezone Asia/Ho_Chi_Minh 2>/dev/null || true
            timedatectl set-ntp true 2>/dev/null || true
            if ! command -v chronyd >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq chrony 2>/dev/null || true
            fi
            systemctl restart chrony 2>/dev/null || true

            # 1. Đăng nhập Docker Hub trên VPS nếu có mật khẩu/token (đảm bảo pull được cả repo private)
            USER_NAME="${DOCKER_USER:-binh1892001}"
            if [ -n "$DOCKER_PASS" ]; then
              echo "==> Đang đăng nhập Docker Hub cho user $USER_NAME..."
              echo "$DOCKER_PASS" | docker login -u "$USER_NAME" --password-stdin || echo "Cảnh báo: Đăng nhập Docker Hub thất bại, sẽ thử pull public..."
            fi

            # 2. Đảm bảo hạ tầng Database & Message Broker/Cache chạy trước
            echo "==> Khởi động hạ tầng nền tảng (Postgres, Redis)..."
            docker compose up -d postgres redis 2>/dev/null || true

            # 3. Kéo image tuần tự với cơ chế retry tự động
            echo "==> Kéo image mới nhất của $USER_NAME từ Docker Hub..."
            pull_with_retry() {
              local img=$1
              for i in 1 2 3; do
                echo "Đang kéo $img (lần thử $i)..."
                if docker pull "$img"; then
                  echo "Kéo $img thành công!"
                  return 0
                else
                  echo "Lần $i thất bại cho $img, thử lại sau 3 giây..."
                  sleep 3
                fi
              done
              echo "Không thể kéo $img sau 3 lần thử!"
              return 1
            }

            pull_with_retry "$USER_NAME/trello-work-backend:latest"
            pull_with_retry "$USER_NAME/trello-work-frontend:latest"

            # 4. Tái khởi động Backend & Frontend với container và code mới nhất
            echo "==> Cập nhật và chạy lại Backend & Frontend..."
            docker compose up -d --no-deps --force-recreate backend frontend

            # 5. Dọn dẹp các images rác/cũ để giải phóng dung lượng ổ cứng VPS
            echo "==> Dọn dẹp images cũ..."
            docker image prune -f

            echo "==> Triển khai thành công dự án Trello Work!"
